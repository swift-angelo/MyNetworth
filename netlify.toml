[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  # Vite 8 needs a recent Node
  NODE_VERSION = "22"

# Always revalidate the service worker and app shell so installed copies pick up new deploys promptly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
