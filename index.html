<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var p = localStorage.getItem('mn-theme') || 'light'
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : p
        document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9fee7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>MyNetworth</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot watchdog: if the app never renders (script failed to load or parse), say so instead of showing a blank screen. -->
    <script>
      var bootErrors = []
      window.addEventListener('error', function (e) {
        bootErrors.push((e.message || 'script error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''))
      })
      window.addEventListener('unhandledrejection', function (e) {
        bootErrors.push('promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason))
      })
      function mnReset() {
        var done = function () { location.reload() }
        Promise.resolve()
          .then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : [] })
          .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) })
          .then(function () { return window.caches ? caches.keys() : [] })
          .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) })
          .then(done, done)
      }
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && !r.firstChild) {
          r.innerHTML =
            '<div style="padding:24px;color:#fff;font-family:system-ui,sans-serif">' +
            '<h2 style="margin:0 0 8px">MyNetworth did not start</h2>' +
            '<p style="color:#a3a3a3;font-size:14px">Your saved entries are safe. Tap the button below to refresh the app files.</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;color:#fca5a5">' + (bootErrors.join('\n') || 'no error reported') + '</pre>' +
            '<button onclick="mnReset()" style="min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#f97316;color:#fff;font-size:16px;font-weight:600">Clear app cache &amp; reload</button>' +
            '</div>'
        }
      }, 5000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
